name: Submit Android (with R8 mapping upload)

on:
  push:
    branches: ['main']

jobs:
  build_android:
    name: Build Android app
    type: build
    params:
      platform: android
      profile: production

  submit_android:
    name: Submit to Google Play Store
    needs: [build_android]
    type: submit
    params:
      profile: production
      build_id: ${{ needs.build_android.outputs.build_id }}

  # NOTE: EAS does not auto-upload ProGuard mapping files. The mapping.txt is
  # retained as a build artifact via buildArtifactPaths in eas.json. Run this
  # job (or the script manually) after the build to upload it to Play Console.
  upload_mapping:
    name: Upload R8 mapping to Play Console
    needs: [build_android]
    type: custom
    steps:
      - name: Download build artifacts
        run: |
          eas build:download --id ${{ needs.build_android.outputs.build_id }} --path ./build-artifacts
      - name: Upload mapping file
        run: |
          export MAPPING_FILE=$(find ./build-artifacts -name mapping.txt | head -1)
          export VERSION_CODE=${{ needs.build_android.outputs.version_code }}
          node scripts/upload-mapping.js
        env:
          PACKAGE_NAME: in.sahilsoni.fullfrillsbalance
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_PATH }}
