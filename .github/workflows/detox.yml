name: Detox (iOS)

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: detox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detox:
    name: iOS Detox critical paths
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_E2E: '1'
      DETOX_METRO_URL: http://127.0.0.1:8081
      DETOX_IOS_DEVICE: iPhone 17
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Prepare E2E env
        run: cp .env.e2e.example .env.local

      - name: Detox framework cache
        run: npx detox clean-framework-cache && npx detox build-framework-cache

      - name: Boot iOS Simulator
        run: |
          set -euo pipefail
          device_name="${DETOX_IOS_DEVICE}"
          udid="$(xcrun simctl list devices available | grep -F "${device_name} (" | head -1 | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')"
          if [ -z "${udid}" ]; then
            echo "No available simulator named ${device_name}" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          xcrun simctl boot "${udid}" 2>/dev/null || true
          xcrun simctl bootstatus "${udid}" -b

      - name: Start Metro
        run: |
          mkdir -p artifacts/detox
          bun start --port 8081 > artifacts/detox/metro.log 2>&1 &
          echo $! > metro.pid
          bash scripts/wait-for-metro.sh

      - name: Build iOS app for Detox
        run: bun run e2e:build:ios

      - name: Run Detox critical specs
        run: bun run e2e:ci

      - name: Stop Metro
        if: ${{ always() }}
        run: |
          if [ -f metro.pid ]; then kill "$(cat metro.pid)" || true; fi

      - name: Upload Detox failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: detox-artifacts
          path: artifacts/detox/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Detox logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: detox-logs
          path: |
            artifacts/detox/**/*.log
            artifacts/detox/**/detox.log
          if-no-files-found: ignore
          retention-days: 14
