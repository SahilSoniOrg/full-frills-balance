name: Detox (iOS)

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: detox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detox:
    name: iOS Detox critical paths
    runs-on: macos-latest
    # Build + press-haptics demo take ~35–45m.
    timeout-minutes: 75
    env:
      EXPO_PUBLIC_E2E: '1'
      DETOX_IOS_DEVICE: iPhone 17
      # Detox Release builds do not have Sentry auth; skip upload so xcodebuild can finish.
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Prepare E2E env
        run: cp .env.e2e.example .env.local

      # Detox iOS driver shells out to applesimutils; macos runners do not ship it.
      # Homebrew 5+ refuses third-party taps unless explicitly trusted.
      - name: Install applesimutils
        run: |
          brew tap wix/brew
          brew trust --formula wix/brew/applesimutils
          brew install applesimutils
          applesimutils --version

      - name: Detox framework cache
        run: npx detox clean-framework-cache && npx detox build-framework-cache

      - name: Boot iOS Simulator
        run: |
          set -euo pipefail
          device_name="${DETOX_IOS_DEVICE}"
          udid="$(xcrun simctl list devices available | grep -F "${device_name} (" | head -1 | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')"
          if [ -z "${udid}" ]; then
            echo "No available simulator named ${device_name}" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          xcrun simctl boot "${udid}" 2>/dev/null || true
          xcrun simctl bootstatus "${udid}" -b

      - name: Build iOS Release app for Detox
        run: bun run e2e:build:ios

      # Record before the full suite so a long/cancelled critical run cannot skip the MR clip.
      - name: Record press-haptics demo video
        run: bun run e2e:ci:press-haptics-video

      # Fallback slideshow if Detox did not emit an mp4 (screenshots still prove the flow).
      - name: Ensure press-haptics demo mp4
        if: ${{ always() }}
        run: bash scripts/stitch-press-haptics-demo.sh artifacts/detox

      - name: Upload press-haptics demo video
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: press-haptics-demo-video
          path: |
            artifacts/detox/**/*.mp4
            artifacts/detox/**/*.mov
            artifacts/detox/**/press-haptics*.png
          if-no-files-found: ignore
          retention-days: 14

      # Demo already asserts onboarded seed → Dashboard → FAB. Do not re-run full/smoke
      # suites here: settings alone exceeds the remaining budget, and picker smoke is
      # unrelated flaky coverage for this Phase 1 job.

      - name: Upload Detox artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: detox-artifacts
          path: artifacts/detox/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Detox logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: detox-logs
          path: |
            artifacts/detox/**/*.log
            artifacts/detox/**/detox.log
          if-no-files-found: ignore
          retention-days: 14
