name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Test, Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # --ignore-scripts skips the litert-lm postinstall, which downloads
      # macOS-only iOS frameworks and has no purpose on a Linux runner.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Unit tests
        run: bunx jest --ci --coverage --maxWorkers=2

      # Schema/migration smoke (Phase 3.4) — included in full suite; explicit for visibility
      - name: Migration smoke
        if: ${{ !cancelled() }}
        run: bunx jest --ci --collectCoverage=false src/data/database/__tests__/migrations.test.ts

      # Runs even if tests fail so a lint warning never masks a test failure.
      - name: Lint
        if: ${{ !cancelled() }}
        run: bunx expo lint

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage/
          retention-days: 14
