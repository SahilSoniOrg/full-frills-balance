name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Architecture, Typecheck, Test, Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # --ignore-scripts skips the litert-lm postinstall, which downloads
      # macOS-only iOS frameworks and has no purpose on a Linux runner.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Production E2E exclusion check
        run: bun run check:production-e2e-bundle

      - name: Verification
        id: verification
        run: bun run verify

      # Keep lint visible when another verification step fails.
      - name: Lint
        if: ${{ !cancelled() && steps.verification.outcome != 'success' }}
        run: bun run lint

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage/
          retention-days: 14
