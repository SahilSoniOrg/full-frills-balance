name: E2E (Web)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install app dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install browser test dependencies
        run: bun run e2e:setup:web
      - name: Export E2E web app
        run: bun run e2e:build:web
      - name: Typecheck browser tests
        run: bun run typecheck:e2e:web
      - name: Run shared smoke cases in Chromium
        run: bun run e2e:test:web
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: web-e2e-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14
