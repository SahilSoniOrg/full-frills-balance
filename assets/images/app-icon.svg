<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- soft earthy sage-green-to-clear gradient fill -->
    <linearGradient id="fillGradient" x1="0" y1="0.8" x2="1" y2="1" gradientTransform="rotate(90)">
      <stop offset="0%" stop-color="#3F8C63" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3F8C63" stop-opacity="0.01"/>
    </linearGradient>

  </defs>

  <!-- background - sophisticated solid pastel sage-mint for a premium, calm finance look -->
  <rect width="1024" height="1024" fill="#E5F4EC"/>

  <!-- Native centered, boldened, and maximized artwork (width = 620px, height = 340px, baseline = 670px) -->
  <g>
    <!-- baseline - deep obsidian emerald black -->
    <line
      x1="202"
      y1="670"
      x2="822"
      y2="670"
      stroke="#052E16"
      stroke-width="28"
      stroke-linecap="round"
      opacity="0.35"
    />

    <!-- area fill - soft sage gradient -->
    <path
      d="
        M202 505
        C299 360 405 330 512 505
        C619 660 725 620 822 445
        L822 670
        L202 670
        Z
      "
      fill="url(#fillGradient)"
    />

    <!-- vertical indicators - deep obsidian emerald black -->
    <line
      x1="202"
      y1="505"
      x2="202"
      y2="670"
      stroke="#052E16"
      stroke-width="16"
      stroke-linecap="round"
      stroke-dasharray="16 24"
      opacity="0.25"
    />

    <line
      x1="425"
      y1="430"
      x2="425"
      y2="670"
      stroke="#052E16"
      stroke-width="16"
      stroke-linecap="round"
      stroke-dasharray="16 24"
      opacity="0.25"
    />

    <line
      x1="618"
      y1="610"
      x2="618"
      y2="670"
      stroke="#052E16"
      stroke-width="16"
      stroke-linecap="round"
      stroke-dasharray="16 24"
      opacity="0.25"
    />

    <line
      x1="764"
      y1="565"
      x2="764"
      y2="670"
      stroke="#052E16"
      stroke-width="16"
      stroke-linecap="round"
      stroke-dasharray="16 24"
      opacity="0.25"
    />

    <line
      x1="822"
      y1="445"
      x2="822"
      y2="670"
      stroke="#052E16"
      stroke-width="16"
      stroke-linecap="round"
      stroke-dasharray="16 24"
      opacity="0.25"
    />

    <!-- main curve - deep obsidian emerald black -->
    <path
      d="
        M202 505
        C299 360 405 330 512 505
        C619 660 725 620 822 445
      "
      stroke="#052E16"
      stroke-width="54"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />

    <!-- endpoint - vibrant jewel-like growth emerald -->
    <circle
      cx="822"
      cy="445"
      r="56"
      fill="#3F8C63"
    />

    <!-- breathing halo - vibrant growth emerald -->
    <circle
      cx="822"
      cy="445"
      r="80"
      fill="#3F8C63"
      opacity="0.12"
    />
  </g>

</svg>
