plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'expo.modules.keycrypto'
version = '1.0.0'
android {
  namespace 'expo.modules.keycrypto'
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
    externalNativeBuild {
      cmake { arguments '-DANDROID_STL=c++_shared', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON' }
    }
  }
  externalNativeBuild { cmake { path 'CMakeLists.txt' } }
  buildFeatures { prefab true }
}
dependencies {
  implementation project(':expo-modules-core')
  // Same pinned native provider used by react-native-quick-crypto.
  implementation 'io.github.ronickg:openssl-static:3.6.2-2'
}
