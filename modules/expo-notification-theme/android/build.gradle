plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.notificationtheme'
version = '1.0.0'

android {
  namespace "expo.modules.notificationtheme"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation expoModule.getExpoDependency('expo-notifications')
}
